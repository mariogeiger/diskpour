repos:
  - repo: local
    hooks:
      - id: check-file-length-and-header
        name: check file length and header
        entry: scripts/check-file-length-and-header
        language: script
        types: [text]
        exclude: ^Cargo\.lock$
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types_or: [rust, toml]
      - id: cargo-test
        name: cargo test
        entry: cargo test --release
        language: system
        pass_filenames: false
        types_or: [rust, toml]
